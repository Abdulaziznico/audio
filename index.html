<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ona Tili Loyiha</title>

<style>
body {
    margin: 0;
    font-family: "Georgia", serif;
    background: url("https://images.unsplash.com/photo-1519681393784-d120267933ba") no-repeat center center/cover;
    background-size: cover;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #3e2c1c;
    position: relative;
    text-align: center;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 248, 220, 0.85);
}

.container {
    position: relative;
    z-index: 2;
    max-width: 600px;
    width: 90%;
    padding: 40px 25px;
    background: rgba(255, 255, 255, 0.75);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h1, h2 {
    margin: 10px 0;
}

.names p {
    margin: 6px 0;
    font-weight: bold;
    opacity: 0;
    animation: slideUp 1s ease forwards;
}

.names p:nth-child(1) { animation-delay: 0.5s; }
.names p:nth-child(2) { animation-delay: 0.8s; }
.names p:nth-child(3) { animation-delay: 1.1s; }
.names p:nth-child(4) { animation-delay: 1.4s; }
.names p:nth-child(5) { animation-delay: 1.7s; }

.audio-section {
    margin-top: 40px;
    opacity: 0;
    transform: translateY(30px);
    animation: audioAppear 1.5s ease forwards;
    animation-delay: 2.2s;
}

audio {
    width: 100%;
    margin-top: 15px;
}

/* Animatsiyalar */

@keyframes slideUp {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes audioAppear {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Telefon uchun */

@media (max-width: 600px) {
    .container {
        padding: 30px 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>10-A sinf o‘quvchilari</h1>
    <h2>Ona tili fanidan tayyorlagan loyiha ishi</h2>

    <div class="names">
        <p>Yoqubov Abdulaziz</p>
        <p>Madumarov Muhammadqodir</p>
        <p>Kamalov Lazizbek</p>
        <p>No'monov Behruzbek</p>
        <p>Babaxodjayev Jamshidbek</p>
    </div>

    <div class="audio-section">
        <h2>🎵 Audio</h2>
        <audio controls>
            <source src="1_clean (1)_2.m4a" type="audio/mp4">
            Brauzeringiz audio qo‘llab-quvvatlamaydi.
        </audio>
    </div>

</div>

</body>
</html>
